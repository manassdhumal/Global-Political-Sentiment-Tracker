# =====================================================================
# Global Political Sentiment Tracker — Watchlist configuration (v4)
# Tracks MEDIA + SOCIAL coverage tone (-100 to +100), NOT public opinion.
# =====================================================================

meta:
  measures: "media_sentiment"
  tone_range: [-100, 100]
  aggregation: "entity_country_week"

# ---------------------------------------------------------------------
# Worldwide Countries (48 key nations spanning all continents).
# ---------------------------------------------------------------------
countries:
  # North America
  - {name: "United States",   gdelt: "US", iso3: "USA"}
  - {name: "Canada",          gdelt: "CA", iso3: "CAN"}
  - {name: "Mexico",          gdelt: "MX", iso3: "MEX"}

  # Latin America & Caribbean
  - {name: "Brazil",          gdelt: "BR", iso3: "BRA"}
  - {name: "Argentina",       gdelt: "AR", iso3: "ARG"}
  - {name: "Colombia",        gdelt: "CO", iso3: "COL"}
  - {name: "Chile",           gdelt: "CI", iso3: "CHL"}
  - {name: "Peru",            gdelt: "PE", iso3: "PER"}
