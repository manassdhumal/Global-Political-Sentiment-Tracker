# =====================================================================
# Global Political Sentiment Tracker — Docker Compose Orchestration
# Single-command launch: docker compose up --build
# =====================================================================

services:
  # --- Backend API Service (FastAPI) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gpst-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GPST_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - gpst-network

  # --- Frontend Dashboard Service (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: gpst-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gpst-network

networks:
  gpst-network:
    driver: bridge
